<div [ngClass]="{'dark-theme': darkMode, 'light-theme': !darkMode}">
  <h1>Angular App / By: {{ headerInfo.name }} ⚙️</h1>
  <h2>{{ headerInfo.role }}</h2>
  <h3>{{ headerInfo.motto }}</h3>
  <nav>
    <ul>
      <li *ngFor="let item of contact">
        <a [href]="item.link">{{ item.platform }}</a>
      </li>
    </ul>
  </nav>
</div>
